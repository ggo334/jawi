<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Elang</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .logo-container {
            width: 256px;
            height: 256px;
            background-color: white; /* Bisa diganti transparent */
            border-radius: 50%; /* Membuat bingkai bulat */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Ganti 'URL_GAMBAR_ANDA_DI_SINI.png' dengan link gambar yang sudah diupload -->
        <img src="URL_GAMBAR_ANDA_DI_SINI.png" alt="Logo Elang">
    </div>

</body>
</html>
