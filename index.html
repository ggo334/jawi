<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Garuda Elang</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a; /* Latar belakang gelap agar logo menonjol */

        }
    </style>

<body>

    <!-- Ganti src dengan Raw URL dari GitHub Anda -->
    <img class="logo" src="https://raw.githubusercontent.com/ggo334/jawi/main/pngtree-illustration-of-garuda-with-indonesian-flag-emblem-png-image_13550572.png" alt="Logo Garuda">
